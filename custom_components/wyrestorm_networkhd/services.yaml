matrix_set:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: wyrestorm_networkhd
    source_device:
      required: false
      example: "Apple TV"
      selector:
        text:
    target_device:
      required: true
      example: "Living Room"
      selector:
        text:
          multiple: true

power_control:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: wyrestorm_networkhd
    devices:
      required: true
      example: "Living Room"
      selector:
        text:
          multiple: true
    power_state:
      required: true
      selector:
        select:
          options:
            - "on"
            - "off"
