# Release Management - Automated Releases with Release Please
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # Don't cancel releases

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write # labels
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Configured by release-please-config.json and .release-please-manifest.json
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug Release Please outputs
        run: |
          echo "Releases created: '${{ steps.release.outputs.releases_created }}'"
          echo "Tag name: '${{ steps.release.outputs.tag_name }}'"
          echo "Version: '${{ steps.release.outputs.version }}'"

  hacs-validation:
    name: HACS Pre-Release Validation
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main @ 2026-06-08
        with:
          category: "integration"

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master @ 2026-10-26

  publish:
    name: Build & Publish Release
    needs: [release-please, hacs-validation]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # release assets
      id-token: write # attestations
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Run health check
        run: make health-check

      - name: Extract coverage percentage
        id: coverage
        continue-on-error: true
        run: |
          if [ -f coverage.xml ]; then
            COVERAGE=$(python -c "
          import xml.etree.ElementTree as ET
          try:
              tree = ET.parse('coverage.xml')
              root = tree.getroot()
              line_rate = float(root.attrib['line-rate'])
              print(f'{line_rate * 100:.0f}')
          except:
              print('0')
          ")
            echo "line-rate=$COVERAGE" >> $GITHUB_OUTPUT
            echo "Coverage percentage: $COVERAGE%"
          else
            echo "line-rate=0" >> $GITHUB_OUTPUT
            echo "Coverage file not found"
          fi

      - name: Update coverage badge
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: wyrestorm-networkhd-ha-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.line-rate || 'N/A' }}%
          valColorRange: ${{ steps.coverage.outputs.line-rate || '0' }}
          maxColorRange: 100
          minColorRange: 0
          namedLogo: pytest

      - name: Create release zip
        run: |
          # Create HACS-compatible zip (files at root level)
          cd custom_components/wyrestorm_networkhd
          zip -r ../../wyrestorm_networkhd.zip . \
            -x "*.pyc" \
            -x "*__pycache__*" \
            -x "*.DS_Store" \
            -x ".DS_Store" \
            -x "._*"
          cd ../..

          # Also create a full bundle
          zip -r wyrestorm-networkhd-ha.zip \
            custom_components/wyrestorm_networkhd/ \
            README.md \
            hacs.json \
            LICENSE \
            -x "*.pyc" \
            -x "*__pycache__*" \
            -x "*.DS_Store" \
            -x "*/.DS_Store" \
            -x "*/._*"

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            wyrestorm_networkhd.zip
            wyrestorm-networkhd-ha.zip
            coverage.xml
          fail_on_unmatched_files: false

      - name: Attest build artifacts
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "*.zip"
