name: "Setup Environment"
description: "Setup Python environment and Home Assistant integration dependencies"
inputs:
  install-deps:
    description: "Whether to install project dependencies"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14" # what Home Assistant 2026.10 runs; requires-python is only a floor
        cache: "pip"
        cache-dependency-path: "pyproject.toml"

    - name: Install dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: make install-deps
